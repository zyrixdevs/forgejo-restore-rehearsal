[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "forgejo-restore-rehearsal"
version = "0.1.0"
description = "Preflight Forgejo backup archives for likely recovery components"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = []

[project.scripts]
forgejo-recovery-check = "forgejo_recovery_check:main"

[tool.setuptools]
py-modules = ["forgejo_recovery_check"]
